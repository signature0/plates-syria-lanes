<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شهادة إهداء — وزارة النقل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="gift">
<div id="hdr"></div>

<main class="container page">
  <div class="page-head">
    <span class="eyebrow" data-i18n="nav.tools">الأدوات</span>
    <h1 data-i18n="gift.title">شهادة إهداء</h1>
    <p class="lead" data-i18n="gift.sub">معاينة حية لشهادة إهداء لوحة مميزة باسم المستفيد</p>
  </div>

  <div class="gift-grid">
    <div class="card card-pad">
      <h2 data-i18n="gift.title">شهادة إهداء</h2>
      <div class="field">
        <label for="gift-name" data-i18n="gift.recipient">اسم المستفيد</label>
        <input class="input" id="gift-name" autocomplete="off">
      </div>
      <div class="form-row">
        <div class="field">
          <label for="gift-gov" data-i18n="cert.gov">المحافظة</label>
          <select class="input" id="gift-gov"></select>
        </div>
        <div class="field">
          <label for="gift-plate" data-i18n="gift.plate">رقم اللوحة</label>
          <select class="input" id="gift-plate"></select>
        </div>
      </div>
      <div class="field">
        <label for="gift-msg" data-i18n="gift.message">رسالة (اختياري)</label>
        <textarea class="input" id="gift-msg" rows="3"></textarea>
      </div>
      <button class="btn btn-gold" id="gift-gen" type="button" data-i18n="gift.gen">حدّث الشهادة</button>
    </div>

    <div id="cert-root"></div>
  </div>
</main>

<div id="ftr"></div>
<div id="toast-root"></div>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
<script src="js/pages/gift.js"></script>
</body>
</html>
