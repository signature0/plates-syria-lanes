<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نتائج المزادات — وزارة النقل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="results">
<div id="hdr"></div>

<main class="container page">
  <div class="page-head">
    <span class="eyebrow" data-i18n="nav.results">النتائج</span>
    <h1 data-i18n="res.title">نتائج المزادات</h1>
    <p class="lead" data-i18n="res.sub">شفافية كاملة: كل نتائج المزادات السابقة وأسعار المطرقة</p>
  </div>

  <div class="dash-grid">
    <div class="dash-card"><div class="lbl" data-i18n="res.dash.revenue">إجمالي الإيرادات</div><div class="val" id="dash-revenue">—</div></div>
    <div class="dash-card"><div class="lbl" data-i18n="res.dash.lots">لوحات مباعة</div><div class="val" id="dash-lots">—</div></div>
    <div class="dash-card"><div class="lbl" data-i18n="res.dash.avg">متوسط سعر المطرقة</div><div class="val" id="dash-avg">—</div></div>
    <div class="dash-card"><div class="lbl" data-i18n="res.dash.top">المحافظة الأولى</div><div class="val" id="dash-top">—</div></div>
  </div>

  <section class="section">
    <h2 data-i18n="res.chart">الإيرادات حسب المحافظة</h2>
    <div class="card card-pad"><div class="bar-chart" id="res-bars"></div></div>
  </section>

  <section class="section">
    <h2 data-i18n="res.table">سجل المزادات المنتهية</h2>
    <div class="table-wrap card card-flat">
      <table class="data" id="res-table">
        <thead>
          <tr>
            <th data-i18n="col.date">التاريخ</th>
            <th data-i18n="col.gov">المحافظة</th>
            <th data-i18n="col.plate">اللوحة</th>
            <th data-i18n="col.start">سعر الانطلاق</th>
            <th data-i18n="col.hammer">سعر المطرقة</th>
            <th data-i18n="col.buyer">المشتري</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<div id="ftr"></div>
<div id="toast-root"></div>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
<script src="js/pages/results.js"></script>
</body>
</html>
